# Runs the unit tests, the build and the browser tests on every pull request.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # SvelteKit 3 needs Node >= 22.17; the vite CLI runs on Node even when invoked through bun.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Check bundle budgets
        run: bun run budget
      # The browser tests use the Google Chrome that is preinstalled on GitHub's runners.
      - name: Browser tests
        run: bun run test:e2e
      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
